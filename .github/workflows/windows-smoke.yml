name: Windows Smoke Test

on:
  push:
    branches:
      - iracing-test
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  smoke:
    name: Build & smoke-test on Windows
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run race-worker API tests
        working-directory: iracing/race-worker
        run: python -m pytest tests/ -v --tb=short

      - name: Build executable
        run: python build.py

      - name: Verify build artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter 'LiveTelemetryEvo-*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'no LiveTelemetryEvo-*.exe in dist/' }
          Write-Host "Built: $($exe.Name) ($([math]::Round($exe.Length / 1MB, 1)) MB)"
          echo "SMOKE_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          echo "SMOKE_EXE_NAME=$($exe.Name)" >> $env:GITHUB_ENV

      - name: Self-test (backend diagnostics)
        shell: pwsh
        run: |
          $env:LIVE_TELEMETRY_DATA_DIR = Join-Path $env:GITHUB_WORKSPACE 'smoke-logs\selftest'
          New-Item -ItemType Directory -Force -Path $env:LIVE_TELEMETRY_DATA_DIR | Out-Null
          $proc = Start-Process -FilePath $env:SMOKE_EXE `
            -ArgumentList "--self-test" `
            -PassThru
          $exited = $proc.WaitForExit(30000)
          if (-not $exited) {
            Write-Host "Self-test timed out after 30s — killing"
            taskkill /T /F /PID $proc.Id 2>$null
          }
          # Read session.log for self-test output
          $logFile = Join-Path $env:LIVE_TELEMETRY_DATA_DIR 'logs' 'session.log'
          if (Test-Path $logFile) {
            Get-Content $logFile | ForEach-Object { Write-Host $_ }
          } else {
            Write-Host "No session.log found — checking stdout"
          }
          Write-Host "Self-test exit code: $($proc.ExitCode)"
          if (-not $exited) {
            throw "Self-test timed out — hardware-independent checks must finish"
          }
          if ($proc.ExitCode -ne 0) {
            throw "Self-test failed with exit code $($proc.ExitCode). Hardware-independent checks are fatal."
          }
          if (Test-Path $logFile) {
            $text = Get-Content $logFile -Raw
            if ($text -notmatch 'Overall: PASS') {
              throw "Self-test log does not contain 'Overall: PASS'"
            }
            if ($text -notmatch 'RawOutputStream') {
              throw "Self-test log does not mention RawOutputStream"
            }
          }

      - name: Frozen audio playback self-test
        shell: pwsh
        run: |
          $env:LIVE_TELEMETRY_DATA_DIR = Join-Path $env:GITHUB_WORKSPACE 'smoke-logs\selftest-audio'
          New-Item -ItemType Directory -Force -Path $env:LIVE_TELEMETRY_DATA_DIR | Out-Null
          $proc = Start-Process -FilePath $env:SMOKE_EXE `
            -ArgumentList "--selftest-audio" `
            -PassThru
          $exited = $proc.WaitForExit(30000)
          if (-not $exited) {
            Write-Host "selftest-audio timed out after 30s — killing"
            taskkill /T /F /PID $proc.Id 2>$null
            throw "selftest-audio timed out"
          }
          $logFile = Join-Path $env:LIVE_TELEMETRY_DATA_DIR 'logs' 'session.log'
          if (Test-Path $logFile) {
            Get-Content $logFile | ForEach-Object { Write-Host $_ }
          } else {
            throw "selftest-audio produced no session.log"
          }
          Write-Host "selftest-audio exit code: $($proc.ExitCode)"
          $text = Get-Content $logFile -Raw
          if ($text -match 'NumPy must be installed') {
            throw "frozen playback still requires numpy"
          }
          if ($text -notmatch 'sounddevice\.RawOutputStream: OK') {
            throw "missing sounddevice.RawOutputStream: OK"
          }
          if ($text -notmatch 'numpy not required: OK') {
            throw "missing numpy not required: OK"
          }
          if ($text -notmatch 'overall: PASS') {
            throw "selftest-audio log does not contain 'overall: PASS'"
          }
          if ($proc.ExitCode -ne 0) {
            throw "selftest-audio failed with exit code $($proc.ExitCode)"
          }

      - name: Prepare smoke-test directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke-screenshots | Out-Null
          New-Item -ItemType Directory -Force -Path smoke-logs | Out-Null

      # ---- Helper: screenshot function defined once ----
      - name: Create screenshot helper
        shell: pwsh
        run: |
          @'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Global:Take-SmokeScreenshot {
            param([string]$OutPath)
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $gfx = [System.Drawing.Graphics]::FromImage($bmp)
            $gfx.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save($OutPath, [System.Drawing.Imaging.ImageFormat]::Png)
            $gfx.Dispose()
            $bmp.Dispose()
            Write-Host "Screenshot saved: $OutPath ($((Get-Item $OutPath).Length) bytes)"
          }
          '@ | Out-File -FilePath $env:GITHUB_WORKSPACE\Take-SmokeScreenshot.ps1 -Encoding UTF8

      # ---- Phase 1: Overlay only (no dialogs) ----
      - name: "Screenshot 1: Overlay (iracing-replay, no dialogs)"
        shell: pwsh
        run: |
          . $env:GITHUB_WORKSPACE\Take-SmokeScreenshot.ps1
          $csv = Join-Path $env:GITHUB_WORKSPACE 'tests\fixtures\sample_replay.csv'
          $dataDir = Join-Path $env:GITHUB_WORKSPACE 'smoke-logs\run-overlay'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $env:LIVE_TELEMETRY_DATA_DIR = $dataDir
          $proc = Start-Process -FilePath $env:SMOKE_EXE `
            -ArgumentList "--source","iracing-replay","--replay-csv",$csv,"--novr" `
            -PassThru
          Start-Sleep -Seconds 10
          Take-SmokeScreenshot -OutPath (Join-Path $env:GITHUB_WORKSPACE 'smoke-screenshots' '01-overlay.png')
          # Tree-kill: PyInstaller oneFile spawns a child Python process
          # that owns the overlay window. Stop-Process only kills the
          # bootloader, orphaning the child (which keeps the window alive).
          taskkill /T /F /PID $proc.Id 2>$null
          Start-Sleep -Seconds 3
          # Belt-and-suspenders: kill anything with the exe name still alive
          Get-Process | Where-Object { $_.Path -like '*LiveTelemetryEvo*' } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

      # ---- Phase 1b: Overlay hidden (toggle off) ----
      - name: "Screenshot 1b: Overlay hidden"
        shell: pwsh
        run: |
          . $env:GITHUB_WORKSPACE\Take-SmokeScreenshot.ps1
          # Verify no overlay process is left from previous step
          $leftover = Get-Process | Where-Object { $_.Path -like '*LiveTelemetryEvo*' }
          if ($leftover) {
            Write-Host "WARNING: leftover overlay process found, killing"
            $leftover | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }
          $csv = Join-Path $env:GITHUB_WORKSPACE 'tests\fixtures\sample_replay.csv'
          $dataDir = Join-Path $env:GITHUB_WORKSPACE 'smoke-logs\run-hidden'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $env:LIVE_TELEMETRY_DATA_DIR = $dataDir
          $proc = Start-Process -FilePath $env:SMOKE_EXE `
            -ArgumentList "--source","iracing-replay","--replay-csv",$csv,"--novr","--overlay-hidden" `
            -PassThru
          Start-Sleep -Seconds 15
          Take-SmokeScreenshot -OutPath (Join-Path $env:GITHUB_WORKSPACE 'smoke-screenshots' '01b-overlay-hidden.png')
          # Dump the session log before killing for diagnostics
          $logFile = Join-Path $dataDir 'logs' 'session.log'
          if (Test-Path $logFile) {
            Write-Host "--- session.log (hidden run) ---"
            Get-Content $logFile | ForEach-Object { Write-Host $_ }
            Write-Host "--- end session.log ---"
          }
          taskkill /T /F /PID $proc.Id 2>$null
          Start-Sleep -Seconds 3

      # ---- Phase 2: Race Worker dialog ----
      - name: "Screenshot 2: Race Worker dialog"
        shell: pwsh
        run: |
          . $env:GITHUB_WORKSPACE\Take-SmokeScreenshot.ps1
          $csv = Join-Path $env:GITHUB_WORKSPACE 'tests\fixtures\sample_replay.csv'
          $dataDir = Join-Path $env:GITHUB_WORKSPACE 'smoke-logs\run-race-worker'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $env:LIVE_TELEMETRY_DATA_DIR = $dataDir
          $proc = Start-Process -FilePath $env:SMOKE_EXE `
            -ArgumentList "--source","iracing-replay","--replay-csv",$csv,"--novr","--open-dialog","race_worker" `
            -PassThru
          Start-Sleep -Seconds 8
          Take-SmokeScreenshot -OutPath (Join-Path $env:GITHUB_WORKSPACE 'smoke-screenshots' '02-dialog-race-worker.png')
          taskkill /T /F /PID $proc.Id 2>$null
          Start-Sleep -Seconds 2

      # ---- Phase 3: TTS dialog ----
      - name: "Screenshot 3: TTS Voice dialog"
        shell: pwsh
        run: |
          . $env:GITHUB_WORKSPACE\Take-SmokeScreenshot.ps1
          $csv = Join-Path $env:GITHUB_WORKSPACE 'tests\fixtures\sample_replay.csv'
          $dataDir = Join-Path $env:GITHUB_WORKSPACE 'smoke-logs\run-tts'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $env:LIVE_TELEMETRY_DATA_DIR = $dataDir
          $proc = Start-Process -FilePath $env:SMOKE_EXE `
            -ArgumentList "--source","iracing-replay","--replay-csv",$csv,"--novr","--open-dialog","tts" `
            -PassThru
          Start-Sleep -Seconds 8
          Take-SmokeScreenshot -OutPath (Join-Path $env:GITHUB_WORKSPACE 'smoke-screenshots' '03-dialog-tts.png')
          taskkill /T /F /PID $proc.Id 2>$null
          Start-Sleep -Seconds 2

      # ---- Phase 4: PTT dialog ----
      - name: "Screenshot 4: PTT Radio dialog"
        shell: pwsh
        run: |
          . $env:GITHUB_WORKSPACE\Take-SmokeScreenshot.ps1
          $csv = Join-Path $env:GITHUB_WORKSPACE 'tests\fixtures\sample_replay.csv'
          $dataDir = Join-Path $env:GITHUB_WORKSPACE 'smoke-logs\run-ptt'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $env:LIVE_TELEMETRY_DATA_DIR = $dataDir
          $proc = Start-Process -FilePath $env:SMOKE_EXE `
            -ArgumentList "--source","iracing-replay","--replay-csv",$csv,"--novr","--open-dialog","ptt" `
            -PassThru
          Start-Sleep -Seconds 8
          Take-SmokeScreenshot -OutPath (Join-Path $env:GITHUB_WORKSPACE 'smoke-screenshots' '04-dialog-ptt.png')
          taskkill /T /F /PID $proc.Id 2>$null
          Start-Sleep -Seconds 2

      # ---- Phase 5: PTT diagnostics ----
      - name: "Screenshot 5: PTT Diagnostics"
        shell: pwsh
        run: |
          . $env:GITHUB_WORKSPACE\Take-SmokeScreenshot.ps1
          $csv = Join-Path $env:GITHUB_WORKSPACE 'tests\fixtures\sample_replay.csv'
          $dataDir = Join-Path $env:GITHUB_WORKSPACE 'smoke-logs\run-ptt-diag'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $env:LIVE_TELEMETRY_DATA_DIR = $dataDir
          $proc = Start-Process -FilePath $env:SMOKE_EXE `
            -ArgumentList "--source","iracing-replay","--replay-csv",$csv,"--novr","--open-dialog","ptt_diag" `
            -PassThru
          Start-Sleep -Seconds 10
          Take-SmokeScreenshot -OutPath (Join-Path $env:GITHUB_WORKSPACE 'smoke-screenshots' '05-ptt-diagnostics.png')
          # Dump diagnostics from session log
          $logFile = Join-Path $dataDir 'logs' 'session.log'
          if (Test-Path $logFile) {
            Write-Host "--- PTT diagnostics log ---"
            Get-Content $logFile | Where-Object { $_ -match 'dinput|winmm|pygame|ptt/input|ptt/dialog' } | ForEach-Object { Write-Host $_ }
            Write-Host "--- end ---"
          }
          taskkill /T /F /PID $proc.Id 2>$null
          Start-Sleep -Seconds 2

      # ---- Phase 6: TTS dialog with ElevenLabs selected ----
      - name: "Screenshot 6: TTS ElevenLabs"
        shell: pwsh
        run: |
          . $env:GITHUB_WORKSPACE\Take-SmokeScreenshot.ps1
          $csv = Join-Path $env:GITHUB_WORKSPACE 'tests\fixtures\sample_replay.csv'
          $dataDir = Join-Path $env:GITHUB_WORKSPACE 'smoke-logs\run-tts-el'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $env:LIVE_TELEMETRY_DATA_DIR = $dataDir
          $proc = Start-Process -FilePath $env:SMOKE_EXE `
            -ArgumentList "--source","iracing-replay","--replay-csv",$csv,"--novr","--open-dialog","tts_elevenlabs" `
            -PassThru
          Start-Sleep -Seconds 10
          Take-SmokeScreenshot -OutPath (Join-Path $env:GITHUB_WORKSPACE 'smoke-screenshots' '06-tts-elevenlabs.png')
          taskkill /T /F /PID $proc.Id 2>$null
          Start-Sleep -Seconds 2

      # ---- Phase 7: Debug dialog ----
      - name: "Screenshot 7: Debug dialog"
        shell: pwsh
        run: |
          . $env:GITHUB_WORKSPACE\Take-SmokeScreenshot.ps1
          $csv = Join-Path $env:GITHUB_WORKSPACE 'tests\fixtures\sample_replay.csv'
          $dataDir = Join-Path $env:GITHUB_WORKSPACE 'smoke-logs\run-debug'
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          $env:LIVE_TELEMETRY_DATA_DIR = $dataDir
          $proc = Start-Process -FilePath $env:SMOKE_EXE `
            -ArgumentList "--source","iracing-replay","--replay-csv",$csv,"--novr","--open-dialog","debug" `
            -PassThru
          Start-Sleep -Seconds 10
          Take-SmokeScreenshot -OutPath (Join-Path $env:GITHUB_WORKSPACE 'smoke-screenshots' '07-debug-dialog.png')
          taskkill /T /F /PID $proc.Id 2>$null
          Start-Sleep -Seconds 2

      # ---- Verify screenshots differ and logs exist ----
      - name: Verify screenshots differ and logs are non-empty
        shell: pwsh
        run: |
          $ssDir = Join-Path $env:GITHUB_WORKSPACE 'smoke-screenshots'
          $pngs = Get-ChildItem -Path $ssDir -Filter '*.png'
          if ($pngs.Count -lt 8) {
            throw "Expected at least 8 screenshots, found $($pngs.Count)"
          }

          # Compute hashes and verify they are not ALL identical
          $hashes = @{}
          foreach ($f in $pngs) {
            $h = (Get-FileHash -Algorithm SHA256 -Path $f.FullName).Hash
            $hashes[$f.Name] = $h
            Write-Host "$($f.Name): $h ($($f.Length) bytes)"
          }
          $unique = ($hashes.Values | Sort-Object -Unique).Count
          Write-Host "Unique hashes: $unique / $($hashes.Count)"
          if ($unique -lt 2) {
            throw "All $($hashes.Count) screenshots are byte-identical — dialogs did not render"
          }

          # Verify overlay-hidden screenshot differs from overlay-visible
          # in the widget areas (corners and bottom center). Compare file
          # sizes and pixel data — a fully hidden overlay should produce a
          # noticeably different screenshot (no coloured tyre/engine widgets).
          $visiblePng = Join-Path $ssDir '01-overlay.png'
          $hiddenPng = Join-Path $ssDir '01b-overlay-hidden.png'
          if ((Test-Path $visiblePng) -and (Test-Path $hiddenPng)) {
            $vHash = (Get-FileHash -Algorithm SHA256 -Path $visiblePng).Hash
            $hHash = (Get-FileHash -Algorithm SHA256 -Path $hiddenPng).Hash
            Write-Host "Overlay visible hash:  $vHash"
            Write-Host "Overlay hidden hash:   $hHash"
            if ($vHash -eq $hHash) {
              throw "FAIL: overlay-hidden screenshot is byte-identical to visible — overlay was not actually hidden"
            }
            # Compare file sizes — the hidden screenshot should be smaller
            # (no widget pixels to encode) or at least significantly different.
            $vSize = (Get-Item $visiblePng).Length
            $hSize = (Get-Item $hiddenPng).Length
            $sizeDiffPct = [math]::Abs($vSize - $hSize) / [math]::Max($vSize, 1) * 100
            Write-Host "Size diff: $([math]::Round($sizeDiffPct, 1))% (visible=$vSize, hidden=$hSize)"
            # Use Python+PIL to compare pixel differences in widget areas
            python (Join-Path $env:GITHUB_WORKSPACE 'tools' 'compare_screenshots.py') $visiblePng $hiddenPng
            if ($LASTEXITCODE -ne 0) {
              throw "Overlay screenshot pixel comparison failed — overlay was not hidden"
            }
          } else {
            Write-Host "WARNING: missing overlay screenshot pair for diff check"
          }

          # Verify at least one session.log is non-empty
          $logsDir = Join-Path $env:GITHUB_WORKSPACE 'smoke-logs'
          $sessionLogs = Get-ChildItem -Path $logsDir -Recurse -Filter 'session.log'
          $nonEmpty = $sessionLogs | Where-Object { $_.Length -gt 0 }
          Write-Host "Session logs found: $($sessionLogs.Count), non-empty: $($nonEmpty.Count)"
          foreach ($l in $sessionLogs) {
            Write-Host "  $($l.FullName): $($l.Length) bytes"
          }
          if ($nonEmpty.Count -eq 0) {
            Write-Host "WARNING: No non-empty session logs found (frozen exe may not write to log dir)"
          }

      - name: Optional race-worker post
        if: env.RACE_WORKER_URL != ''
        shell: pwsh
        env:
          RACE_WORKER_URL: ${{ secrets.RACE_WORKER_URL }}
          RACE_WORKER_APP_TOKEN: ${{ secrets.RACE_WORKER_APP_TOKEN }}
        run: |
          $baseUrl = $env:RACE_WORKER_URL.TrimEnd('/').TrimEnd('/race')
          $headers = @{
            'Authorization' = "Bearer $env:RACE_WORKER_APP_TOKEN"
            'Content-Type' = 'application/json'
          }
          try {
            $health = Invoke-RestMethod -Uri "$baseUrl/race/health" -Headers $headers -Method Get -TimeoutSec 10
            Write-Host "Race Worker health: $($health | ConvertTo-Json -Compress)"
          } catch {
            Write-Host "Race-worker post failed (non-fatal): $_"
          }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-screenshots/
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: smoke-logs/
          if-no-files-found: warn
